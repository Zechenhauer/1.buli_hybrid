  </defs>

  <!-- App-Rahmen -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" stroke="#d4af37" stroke-width="6" />
  <rect x="42" y="42" width="428" height="428" rx="94" fill="none" stroke="#d4af37" stroke-width="1.5" opacity="0.6" />

  <!-- Code-Klammer Links < -->
  <path d="M 125 185 L 65 240 L 125 295 L 125 270 L 85 240 L 125 210 Z" fill="url(#goldGrad)" />

  <!-- Initialen JS -->
  <text x="225" y="272" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, sans-serif" font-size="115" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="-4">JS</text>

  <!-- Schrägstrich / -->
  <path d="M 315 170 L 338 170 L 305 310 L 282 310 Z" fill="url(#goldGrad)" />

  <!-- Code-Klammer Rechts > -->
  <path d="M 365 185 L 425 240 L 365 295 L 365 270 L 405 240 L 365 210 Z" fill="url(#goldGrad)" />

  <!-- Linie unten -->
